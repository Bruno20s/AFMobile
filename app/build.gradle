plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.afmobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.afmobile"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Firebase BOM para gerenciamento de versões
    implementation platform('com.google.firebase:firebase-bom:34.14.0')
    // Firebase Firestore
    implementation 'com.google.firebase:firebase-firestore'
    // OkHttp para chamadas de rede
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Play Services Location para acesso à localização GPS
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    // Gson para parsing de JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}